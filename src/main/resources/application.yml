
server:
  port: 8880
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: aidemo1  # 应用名称，用于标识该应用
  
  # Jackson JSON 配置
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Shanghai
  profiles:
    active: local      # 激活本地开发环境配置
  ai:



    mcp:
      client:
        # SSE模式配置 - 通过HTTP/SSE方式连接MCP服务
        sse:
          connections:
            server1: # MCP服务实例名称
              url: http://localhost:8881  # MCP服务地址，与mcp的端口一致

    # 阿里云百炼配置
    dashscope:
      api-key: sk-03015e5be9204241b67a4641b6edc3a3
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v1  # 阿里云嵌入模型
    
    # RAG向量存储配置
    vectorstore:
      pgvector:
        table-name: ai_knowledge_vectors  # 向量存储表名
        dimensions: 1536                  # 嵌入向量维度
        initialize-schema: true           # 自动创建表结构
        distance-type: COSINE_DISTANCE    # 距离计算方式



  # 2. Redis 配置（用于缓存搜索建议）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      connect-timeout: 3000ms
      password: # 如果Redis有密码则设置
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 3000ms
        shutdown-timeout: 100ms


  # 3. MySQL 配置（用于同步商品数据）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/aidemo1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root                # 你的 MySQL 用户名
    password: 123456              # 你的 MySQL 密码
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 初始连接数
      initial-size: 5
      # 最小连接池数量
      min-idle: 5
      # 最大连接池数量
      max-active: 20
      # 配置获取连接等待超时的时间
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 配置检测连接是否有效
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 打开PSCache，并且指定每个连接上PSCache的大小
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
      filters: stat,wall
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connect-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      # 配置DruidStatFilter
      web-stat-filter:
        enabled: true
        url-pattern: "/*"
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
      # 配置DruidStatViewServlet
      stat-view-servlet:
        enabled: true
        url-pattern: "/druid/*"
        # IP白名单(没有配置或者为空，则允许所有访问)
        allow: 127.0.0.1,192.168.1.0/24
        # IP黑名单 (存在共同时，deny优先于allow)
        deny: 192.168.1.73
        #  禁用HTML页面上的"Reset All"功能
        reset-enable: false
        # 登录名
        login-username: admin
        # 登录密码
        login-password: 123456

# 4. MyBatis-Plus 配置（可选，用于简化 MySQL 查询）
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml  # Mapper 接口的 XML 路径
  type-aliases-package: org.example.ai.entity  # 实体类包路径
  configuration:
    map-underscore-to-camel-case: true  # 下划线转驼峰（适配 MySQL 字段名）


